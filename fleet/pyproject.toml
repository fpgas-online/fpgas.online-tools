[project]
name = "fpgas-online-fleet"
version = "0.1.0"
description = "fpgas.online fleet inventory tooling: diff and update the board tracking sheet"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
]

[project.scripts]
fleet-sheet = "fleetsheet.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleetsheet"]

[tool.ruff]
line-length = 120
extend = "../ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
